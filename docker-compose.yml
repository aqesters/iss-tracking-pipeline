# =============================================================================
# IIoT Data Pipeline — Node-RED (ingestion/routing) -> InfluxDB (storage) ->
# Grafana (dashboards)
#
# Usage:
#   cp .env.example .env   # then fill in real values
#   docker compose up -d
#
# See README.md for the full setup walkthrough and docs/ARCHITECTURE.md for
# how data flows through the stack.
# =============================================================================

services:
  influxdb:
    image: influxdb:2.7
    container_name: ${COMPOSE_PROJECT_NAME:-iiot}-influxdb
    restart: unless-stopped
    ports:
      # Comment this out in production if only Node-RED/Grafana (same docker
      # network) need to reach InfluxDB — reduces attack surface.
      - "127.0.0.1:8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_INIT_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_INIT_BUCKET}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_INIT_RETENTION:-90d}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - iiot-net

  node-red:
    build:
      context: ./node-red
    container_name: ${COMPOSE_PROJECT_NAME:-iiot}-node-red
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "${NODE_RED_PORT:-1880}:1880"
    environment:
      TZ: ${TZ:-America/Chicago}
      INFLUXDB_URL: ${INFLUXDB_URL}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      NODE_RED_CREDENTIAL_SECRET: ${NODE_RED_CREDENTIAL_SECRET}
      NODE_RED_ENABLE_AUTH: ${NODE_RED_ENABLE_AUTH:-false}
    volumes:
      - node-red-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1880/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - iiot-net

  grafana:
    image: grafana/grafana-oss:11.2.0
    container_name: ${COMPOSE_PROJECT_NAME:-iiot}-grafana
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ALLOW_ANONYMOUS:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Passed through so provisioning YAML can use $__env{} substitution
      INFLUXDB_URL: ${INFLUXDB_URL}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - iiot-net

volumes:
  influxdb-data:
  influxdb-config:
  node-red-data:
  grafana-data:

networks:
  iiot-net:
    driver: bridge
