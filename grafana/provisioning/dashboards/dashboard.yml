# Tells Grafana to auto-load any dashboard JSON dropped in
# grafana/dashboards/ — commit new dashboards there and they appear on the
# next container restart, no manual import required.
apiVersion: 1

providers:
  - name: "IIoT Pipeline Dashboards"
    orgId: 1
    folder: "Plant Floor"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
